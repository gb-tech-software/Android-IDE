name: Debug Build

# Triggered automatically on pushes to the configured branches, pull requests,
# and manual dispatch.
# Runs lint and builds the debug APK.
#
# Debug APK is always signed with the auto-generated Android SDK debug keystore.
#
# Downloading the APK:
#   GitHub Actions wraps uploaded artifacts in a zip archive.
#   Download the artifact, unzip it, and install the .apk inside:
#     adb install app-debug.apk          (USB / wireless debugging)
#   Or transfer the .apk to the device and open it with a file manager
#   (requires "Install from unknown sources" enabled in Android settings).

on:
  push:
    branches: [main, develop, dev, test]
  pull_request:
    branches: [main, dev, test]
  workflow_dispatch:

env:
  ANDROID_TARGET_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  check:
    name: Lint & Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare committed Gradle wrapper
        working-directory: android-ide/android
        run: |
          chmod +x gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          test -r gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Node.js for the offline runtime bundle
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_TARGET_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      # Download Monaco 0.52.0 AMD bundle into assets/editor/vs/.
      # vs/ is git-ignored (~20 MB); script is idempotent and exits early if present.
      - name: Bundle Monaco editor
        working-directory: android-ide
        run: bash scripts/fetch-monaco.sh

      # Gradle signs debug APKs with the Android SDK debug keystore.
      # On a fresh GitHub Actions runner ~/.android/debug.keystore does not exist;
      # this step provisions it so assembleDebug has a valid signing resource.
      - name: Provision debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
            echo "Debug keystore created."
          else
            echo "Debug keystore already present."
          fi

      - name: Validate debug keystore
        run: |
          keytool -list \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey
          echo "Debug keystore validated."

      - name: Lint
        working-directory: android-ide/android
        run: ./gradlew lint

      - name: Build debug APK
        working-directory: android-ide/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-ide-debug
          path: android-ide/android/app/build/outputs/apk/debug/*.apk
          compression-level: 9
          retention-days: 7
